<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#14b8a6"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="500" fill="url(#bg-grad)" rx="14"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">Pipeline Architecture</text>

  <!-- ====== ROW 1: Data Flow ====== -->

  <!-- Simulator -->
  <rect x="50" y="70" width="150" height="56" rx="10" fill="#1a1a25" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="125" y="96" text-anchor="middle" fill="#14b8a6" font-size="12" font-weight="600">Request Simulator</text>
  <text x="125" y="113" text-anchor="middle" fill="#64748b" font-size="9">kafka/producers/</text>

  <!-- Arrow Simulator -> requests.raw -->
  <line x1="200" y1="98" x2="260" y2="98" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- requests.raw -->
  <rect x="260" y="70" width="130" height="56" rx="10" fill="#1a1a25" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="325" y="93" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">requests.raw</text>
  <text x="325" y="110" text-anchor="middle" fill="#64748b" font-size="9">Kafka topic</text>

  <!-- Arrow requests.raw -> Flink -->
  <line x1="390" y1="98" x2="450" y2="98" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Flink Fraud -->
  <rect x="450" y="60" width="160" height="66" rx="10" fill="#1a1a25" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="530" y="86" text-anchor="middle" fill="#06b6d4" font-size="12" font-weight="600">Flink Fraud</text>
  <text x="530" y="103" text-anchor="middle" fill="#64748b" font-size="9">14 rules &#183; 3 detectors</text>
  <text x="530" y="117" text-anchor="middle" fill="#64748b" font-size="9">user &#8594; session &#8594; publisher</text>

  <!-- ====== ROW 2: Route Topics ====== -->
  <line x1="530" y1="126" x2="530" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Branch lines -->
  <line x1="450" y1="170" x2="450" y2="180" stroke="#64748b" stroke-width="1"/>
  <line x1="220" y1="180" x2="720" y2="180" stroke="#64748b" stroke-width="1"/>
  <line x1="220" y1="180" x2="220" y2="190" stroke="#64748b" stroke-width="1"/>
  <line x1="350" y1="180" x2="350" y2="190" stroke="#64748b" stroke-width="1"/>
  <line x1="530" y1="180" x2="530" y2="190" stroke="#64748b" stroke-width="1"/>
  <line x1="720" y1="180" x2="720" y2="190" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Label: score-based routing -->
  <text x="530" y="176" text-anchor="middle" fill="#64748b" font-size="8">score-based routing</text>

  <!-- requests.sus -->
  <rect x="150" y="190" width="140" height="50" rx="8" fill="#1a1a25" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="220" y="214" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="600">requests.sus</text>
  <text x="220" y="230" text-anchor="middle" fill="#64748b" font-size="9">score 0.5&#8211;0.8</text>

  <!-- requests.clean -->
  <rect x="290" y="190" width="140" height="50" rx="8" fill="#1a1a25" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="360" y="214" text-anchor="middle" fill="#14b8a6" font-size="11" font-weight="600">requests.clean</text>
  <text x="360" y="230" text-anchor="middle" fill="#64748b" font-size="9">score &lt; 0.5</text>

  <!-- requests.fraud -->
  <rect x="460" y="190" width="140" height="50" rx="8" fill="#1a1a25" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="530" y="214" text-anchor="middle" fill="#f43f5e" font-size="11" font-weight="600">requests.fraud</text>
  <text x="530" y="230" text-anchor="middle" fill="#64748b" font-size="9">score &#8805; 0.8</text>

  <!-- ad.injection -->
  <rect x="640" y="190" width="140" height="50" rx="8" fill="#1a1a25" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="710" y="214" text-anchor="middle" fill="#14b8a6" font-size="11" font-weight="600">ad.injection</text>
  <text x="710" y="230" text-anchor="middle" fill="#64748b" font-size="9">approved</text>

  <!-- ====== ROW 3: Services ====== -->

  <!-- RFC Scoring -->
  <rect x="150" y="280" width="140" height="56" rx="10" fill="#1a1a25" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="220" y="306" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="600">RFC Scoring</text>
  <text x="220" y="322" text-anchor="middle" fill="#64748b" font-size="9">RandomForest model</text>

  <!-- Arrow sus -> RFC -->
  <line x1="220" y1="240" x2="220" y2="280" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)" stroke-dasharray="4,3"/>

  <!-- RFC -> requests.clean or requests.fraud -->
  <line x1="290" y1="308" x2="360" y2="240" stroke="#14b8a6" stroke-width="1" marker-end="url(#arrow-teal)"/>
  <text x="310" y="280" fill="#14b8a6" font-size="8">clean</text>
  <line x1="290" y1="308" x2="530" y2="240" stroke="#f43f5e" stroke-width="1" marker-end="url(#arrow-rose)"/>
  <text x="380" y="270" fill="#f43f5e" font-size="8">fraud</text>

  <!-- Moderation -->
  <rect x="350" y="370" width="160" height="56" rx="10" fill="#1a1a25" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="430" y="396" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="600">Moderation</text>
  <text x="430" y="412" text-anchor="middle" fill="#64748b" font-size="9">mock / OpenAI API</text>

  <!-- clean -> Moderation -->
  <line x1="360" y1="240" x2="430" y2="370" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <text x="380" y="310" fill="#14b8a6" font-size="8">clean</text>

  <!-- Moderation -> ad.injection -->
  <line x1="510" y1="400" x2="710" y2="240" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <text x="620" y="340" fill="#14b8a6" font-size="8">clean</text>

  <!-- Moderation -> requests.fraud -->
  <line x1="430" y1="426" x2="530" y2="240" stroke="#f43f5e" stroke-width="1" marker-end="url(#arrow-rose)"/>
  <text x="460" y="350" fill="#f43f5e" font-size="8">unsafe</text>

  <!-- Spark -->
  <rect x="580" y="370" width="160" height="56" rx="10" fill="#1a1a25" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="660" y="396" text-anchor="middle" fill="#8b5cf6" font-size="12" font-weight="600">Spark Analytics</text>
  <text x="660" y="412" text-anchor="middle" fill="#64748b" font-size="9">RandomForest training</text>

  <!-- Arrow requests.fraud -> Spark, ad.injection -> Spark -->
  <line x1="600" y1="240" x2="660" y2="370" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-violet)"/>
  <text x="615" y="310" fill="#8b5cf6" font-size="8">logs</text>
  <line x1="710" y1="240" x2="660" y2="370" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Spark -> RFC (model artifact) -->
  <path d="M580,398 Q400,450 220,336" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow-violet)"/>
  <text x="380" y="460" text-anchor="middle" fill="#8b5cf6" font-size="8">model artifact</text>

  <!-- Legend -->
  <rect x="50" y="460" width="10" height="10" rx="2" fill="#14b8a6"/>
  <text x="66" y="470" fill="#64748b" font-size="9">Data flow</text>
  <rect x="200" y="460" width="10" height="10" rx="2" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="216" y="470" fill="#64748b" font-size="9">Planned / not yet built</text>
  <rect x="430" y="460" width="10" height="10" rx="2" fill="#8b5cf6"/>
  <text x="446" y="470" fill="#64748b" font-size="9">Offline batch</text>
</svg>
