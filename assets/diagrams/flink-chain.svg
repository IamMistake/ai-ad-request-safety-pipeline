<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" font-family="Manrope, -apple-system, sans-serif">
  <!-- XML-safe numeric entities only; this SVG is loaded as image/svg+xml. -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#14b8a6"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="850" height="180" fill="url(#bg-grad)" rx="12"/>

  <!-- Source: requests.raw -->
  <rect x="20" y="40" width="100" height="44" rx="8" fill="#1a1a25" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="70" y="57" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">Kafka Source</text>
  <text x="70" y="73" text-anchor="middle" fill="#64748b" font-size="9">requests.raw</text>

  <line x1="120" y1="62" x2="150" y2="62" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Watermarks -->
  <rect x="150" y="35" width="90" height="54" rx="8" fill="#1a1a25" stroke="#64748b" stroke-width="1"/>
  <text x="195" y="55" text-anchor="middle" fill="#64748b" font-size="9">Event-Time</text>
  <text x="195" y="71" text-anchor="middle" fill="#64748b" font-size="9">Watermarks</text>
  <text x="195" y="83" text-anchor="middle" fill="#64748b" font-size="8">out-of-orderness</text>

  <line x1="240" y1="62" x2="270" y2="62" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- User Detector -->
  <rect x="270" y="30" width="100" height="64" rx="8" fill="#1a1a25" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="320" y="52" text-anchor="middle" fill="#14b8a6" font-size="10" font-weight="600">User</text>
  <text x="320" y="66" text-anchor="middle" fill="#14b8a6" font-size="10" font-weight="600">Detector</text>
  <text x="320" y="82" text-anchor="middle" fill="#64748b" font-size="8">keyBy(user_ip)</text>
  <text x="320" y="90" text-anchor="middle" fill="#64748b" font-size="8">1 rule: IP burst</text>

  <line x1="370" y1="62" x2="400" y2="62" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Session Detector -->
  <rect x="400" y="30" width="100" height="64" rx="8" fill="#1a1a25" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="450" y="52" text-anchor="middle" fill="#06b6d4" font-size="10" font-weight="600">Session</text>
  <text x="450" y="66" text-anchor="middle" fill="#06b6d4" font-size="10" font-weight="600">Detector</text>
  <text x="450" y="82" text-anchor="middle" fill="#64748b" font-size="8">keyBy(session_id)</text>
  <text x="450" y="90" text-anchor="middle" fill="#64748b" font-size="8">6 rules</text>

  <line x1="500" y1="62" x2="530" y2="62" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Publisher Detector -->
  <rect x="530" y="30" width="100" height="64" rx="8" fill="#1a1a25" stroke="#a855f7" stroke-width="1.5"/>
  <text x="580" y="52" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="600">Publisher</text>
  <text x="580" y="66" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="600">Detector</text>
  <text x="580" y="82" text-anchor="middle" fill="#64748b" font-size="8">keyBy(publisher_id)</text>
  <text x="580" y="90" text-anchor="middle" fill="#64748b" font-size="8">3 rules</text>

  <line x1="630" y1="62" x2="660" y2="62" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Score Aggregation -->
  <rect x="660" y="35" width="80" height="54" rx="8" fill="#1a1a25" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="700" y="55" text-anchor="middle" fill="#f43f5e" font-size="9" font-weight="600">Score</text>
  <text x="700" y="68" text-anchor="middle" fill="#f43f5e" font-size="9" font-weight="600">Route</text>
  <text x="700" y="82" text-anchor="middle" fill="#64748b" font-size="8">+ stateless</text>

  <!-- Route arrows -->
  <line x1="700" y1="89" x2="700" y2="115" stroke="#64748b" stroke-width="1"/>
  <line x1="620" y1="115" x2="780" y2="115" stroke="#64748b" stroke-width="1"/>
  <line x1="620" y1="115" x2="620" y2="130" stroke="#14b8a6" stroke-width="1" marker-end="url(#arrow-green)"/>
  <line x1="700" y1="115" x2="700" y2="130" stroke="#f43f5e" stroke-width="1" marker-end="url(#arrow-rose)"/>
  <line x1="780" y1="115" x2="780" y2="130" stroke="#a855f7" stroke-width="1"/>

  <rect x="560" y="130" width="120" height="36" rx="6" fill="#1a1a25" stroke="#14b8a6" stroke-width="1"/>
  <text x="620" y="153" text-anchor="middle" fill="#14b8a6" font-size="9">requests.clean</text>

  <rect x="640" y="130" width="120" height="36" rx="6" fill="#1a1a25" stroke="#f43f5e" stroke-width="1"/>
  <text x="700" y="153" text-anchor="middle" fill="#f43f5e" font-size="9">requests.fraud</text>

  <rect x="720" y="130" width="120" height="36" rx="6" fill="#1a1a25" stroke="#a855f7" stroke-width="1"/>
  <text x="780" y="153" text-anchor="middle" fill="#a855f7" font-size="9">requests.sus</text>

  <!-- Threshold labels -->
  <text x="620" y="128" text-anchor="middle" fill="#14b8a6" font-size="8">&lt; 0.5</text>
  <text x="700" y="128" text-anchor="middle" fill="#f43f5e" font-size="8">&#8805; 0.8</text>
  <text x="780" y="128" text-anchor="middle" fill="#a855f7" font-size="8">0.5&#8211;0.8</text>
</svg>
