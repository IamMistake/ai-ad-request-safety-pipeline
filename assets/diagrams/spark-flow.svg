<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 240" font-family="Manrope, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#14b8a6"/>
    </marker>
  </defs>

  <rect width="750" height="240" fill="url(#bg-grad)" rx="12"/>

  <text x="375" y="28" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">Spark Training Pipeline</text>

  <!-- Historical Logs -->
  <rect x="40" y="55" width="140" height="50" rx="8" fill="#1a1a25" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="78" text-anchor="middle" fill="#f1f5f9" font-size="10" font-weight="600">Historical Logs</text>
  <text x="110" y="95" text-anchor="middle" fill="#64748b" font-size="8">request_logs.json</text>

  <line x1="180" y1="80" x2="220" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Spark Session -->
  <rect x="220" y="50" width="120" height="60" rx="8" fill="#1a1a25" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="280" y="73" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="600">Spark Session</text>
  <text x="280" y="88" text-anchor="middle" fill="#64748b" font-size="8">read + parse JSON</text>
  <text x="280" y="100" text-anchor="middle" fill="#64748b" font-size="8">build_feature_df()</text>

  <line x1="340" y1="80" x2="380" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Feature Engineering -->
  <rect x="380" y="45" width="130" height="70" rx="8" fill="#1a1a25" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="445" y="66" text-anchor="middle" fill="#14b8a6" font-size="10" font-weight="600">Feature</text>
  <text x="445" y="80" text-anchor="middle" fill="#14b8a6" font-size="10" font-weight="600">Engineering</text>
  <text x="445" y="96" text-anchor="middle" fill="#64748b" font-size="8">contains_scam</text>
  <text x="445" y="107" text-anchor="middle" fill="#64748b" font-size="8">asn + fraud_score</text>

  <!-- Branch: Risk Rollups -->
  <line x1="510" y1="80" x2="550" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="550" y="55" width="160" height="50" rx="8" fill="#1a1a25" stroke="#14b8a6" stroke-width="1"/>
  <text x="630" y="78" text-anchor="middle" fill="#14b8a6" font-size="10" font-weight="600">Risk Rollups</text>
  <text x="630" y="94" text-anchor="middle" fill="#64748b" font-size="8">per IP / publisher / ASN / session</text>

  <!-- Branch: ML Training -->
  <path d="M445,115 L445,150 L260,150 L260,170" fill="none" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="380" y="147" fill="#8b5cf6" font-size="9">RandomForest training</text>

  <rect x="180" y="170" width="160" height="50" rx="8" fill="#1a1a25" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="260" y="193" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="600">Model Artifacts</text>
  <text x="260" y="209" text-anchor="middle" fill="#64748b" font-size="8">fraud_model.pkl + metrics.json</text>

  <!-- Feedback arrow to RFC -->
  <path d="M180,195 L40,195 L40,170 L40,140" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-violet)"/>
  <text x="10" y="170" fill="#a855f7" font-size="8" transform="rotate(-90,10,170)">to RFC Scoring Service</text>
</svg>
