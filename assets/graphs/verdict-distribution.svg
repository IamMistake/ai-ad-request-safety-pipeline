<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <rect width="400" height="270" fill="url(#bg-grad)" rx="12"/>

  <text x="200" y="28" text-anchor="middle" fill="#f1f5f9" font-size="14" font-weight="700">2,000-Request Pipeline Test</text>

  <!-- Total bar -->
  <text x="50" y="62" fill="#64748b" font-size="9" text-anchor="end">Total Sent</text>
  <rect x="60" y="48" width="300" height="20" rx="4" fill="#1a1a25" stroke="#64748b" stroke-width="1"/>
  <text x="370" y="63" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="start">2,000</text>

  <!-- Ad injection -->
  <text x="50" y="92" fill="#64748b" font-size="9" text-anchor="end">Ad Injection</text>
  <rect x="60" y="78" width="244" height="20" rx="4" fill="#14b8a6" opacity="0.3"/>
  <rect x="60" y="78" width="244" height="20" rx="4" fill="none" stroke="#14b8a6" stroke-width="1"/>
  <text x="370" y="93" fill="#14b8a6" font-size="11" font-weight="600" text-anchor="start">1,626</text>

  <!-- Shallow Denied -->
  <text x="50" y="122" fill="#64748b" font-size="9" text-anchor="end">Shallow Denied</text>
  <rect x="60" y="108" width="56" height="20" rx="4" fill="#f43f5e" opacity="0.3"/>
  <rect x="60" y="108" width="56" height="20" rx="4" fill="none" stroke="#f43f5e" stroke-width="1"/>
  <text x="370" y="123" fill="#f43f5e" font-size="11" font-weight="600" text-anchor="start">374</text>

  <!-- Flink suspicious -->
  <text x="50" y="152" fill="#64748b" font-size="9" text-anchor="end">Flink Suspicious</text>
  <rect x="60" y="138" width="186" height="20" rx="4" fill="#f59e0b" opacity="0.3"/>
  <rect x="60" y="138" width="186" height="20" rx="4" fill="none" stroke="#f59e0b" stroke-width="1"/>
  <text x="370" y="153" fill="#f59e0b" font-size="11" font-weight="600" text-anchor="start">1,240</text>

  <!-- Flink clean -->
  <text x="50" y="182" fill="#64748b" font-size="9" text-anchor="end">Flink Clean</text>
  <rect x="60" y="168" width="58" height="20" rx="4" fill="#14b8a6" opacity="0.3"/>
  <rect x="60" y="168" width="58" height="20" rx="4" fill="none" stroke="#14b8a6" stroke-width="1"/>
  <text x="370" y="183" fill="#14b8a6" font-size="11" font-weight="600" text-anchor="start">386</text>

  <!-- Flink fraud -->
  <text x="50" y="212" fill="#64748b" font-size="9" text-anchor="end">Flink Fraud</text>
  <rect x="60" y="198" width="4" height="20" rx="4" fill="#f43f5e" opacity="0.3"/>
  <rect x="60" y="198" width="4" height="20" rx="4" fill="none" stroke="#f43f5e" stroke-width="1"/>
  <text x="370" y="213" fill="#f43f5e" font-size="11" font-weight="600" text-anchor="start">0</text>

  <!-- Session summaries -->
  <text x="50" y="242" fill="#64748b" font-size="9" text-anchor="end">Session Summaries</text>
  <rect x="60" y="228" width="50" height="20" rx="4" fill="#8b5cf6" opacity="0.3"/>
  <rect x="60" y="228" width="50" height="20" rx="4" fill="none" stroke="#8b5cf6" stroke-width="1"/>
  <text x="370" y="243" fill="#8b5cf6" font-size="11" font-weight="600" text-anchor="start">336</text>
</svg>
